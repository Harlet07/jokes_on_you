<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jokes_On_You</title>

<style> 
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

@font-face {
    font-family: 'JetBrainsMono Nerd Font Propo';
    src: url('/fonts/JetBrainsMonoNLNerdFontPropo-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap; /* Improves loading performance */
}

@font-face {
    font-family: 'JetBrainsMono Nerd Font Propo';
    src: url('/fonts/JetBrainsMonoNLNerdFontPropo-Regular.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}   

body {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    background: #020406;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.screen {
    width: 460px;
    max-width: 100%;
    background: rgba(2, 4, 6, 1);
    backdrop-filter: blur(12px);
    border: 3px solid rgba(25, 25, 255, 1);
    border-radius: 16px;
    padding: 28px;
    /* box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5); */
}

.title {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    color: #f8fafc;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 0.5px;
}

.txt {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    color: #b4d3f2;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 0.5px;
}

/* Category Selection styling */
.category-label {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.cat-btn {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    background: #183051;
    color: #cbd5e1;
    border: none;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.cat-btn:hover {
    background: #163e77;
    color: #fff;
}

.cat-btn.active {
    background: #1b1bde;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
}

/* Joke display box */
.joke-box-wrapper {
    background: #0f172a;
    border: 1px solid #1919FF;
    border-radius: 12px;
    padding: 20px;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

#joke {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    color: #38bdf8;
    font-size: 17px;
    line-height: 1.6;
    white-space: pre-wrap;
    text-align: center;
    width: 100%;
}

.loading {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    color: #94a3b8 !important;
    font-style: italic;
}

/* Next Joke Button */
.action-btn {
    font-family: 'JetBrainsMono Nerd Font Propo', 'JetBrains Mono', monospace;
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, #000072, #1919FF);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}

.action-btn:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
}

.action-btn:active {
    transform: translateY(1px);
}
</style>
</head>
<body>
    
    
    <div class="screen">
        
        
        <div class="title">Jokes_On_You</div>
        <div class="txt">
            Don't read dark category jokes...<br>Well who am I to tell you.
        </div>

    <span class="category-label">Select Category</span>
    <div class="categories">
        <!-- <button class="cat-btn active" onclick="setCategory('Any', this)">Any</button> -->
        <button class="cat-btn active" onclick="setCategory('Programming', this)">Programming</button>
        <button class="cat-btn" onclick="setCategory('Misc', this)">Misc</button>
        <button class="cat-btn" onclick="setCategory('Pun', this)">Pun</button>
        <button class="cat-btn" onclick="setCategory('Spooky', this)">Spooky</button>
        <button class="cat-btn" onclick="setCategory('Dark', this)">Dark</button>
    </div>

    <div class="joke-box-wrapper">
        <div id="joke">Press the button below!</div>
    </div>

    <button class="action-btn" onclick="nextJoke()">Next Joke</button>
</div>

<script>
let selectedCategory = "Programming";

function setCategory(category, element) {
    selectedCategory = category;
    
    // Update active class on buttons
    const buttons = document.querySelectorAll('.cat-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');

    // Automatically load a joke from the new category
    nextJoke();
}

async function getJoke() {
    if(selectedCategory=="Dark"){
        const url = `https://v2.jokeapi.dev/joke/${selectedCategory}`;
    } else{
        const url = `https://v2.jokeapi.dev/joke/${selectedCategory}?safe-mode`;
    }
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("Network Error");
    }

    const data = await response.json();

    if (data.type === "single") {
        return data.joke;
    }

    return `${data.setup}\n\n${data.delivery}`;
}

async function nextJoke() {
    const jokeBox = document.getElementById("joke");

    jokeBox.className = "loading";
    jokeBox.textContent = "Fetching a funny one...";

    try {
        const joke = await getJoke();
        jokeBox.className = "";
        jokeBox.textContent = joke;
    } catch (err) {
        jokeBox.className = "";
        jokeBox.textContent = "Failed to load joke. Please try again!";
        console.error(err);
    }
}

// Load initial joke on startup
window.onload = nextJoke;
</script>

</body>
</html>
